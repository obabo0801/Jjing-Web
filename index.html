<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="app.title">&#8203;</title>

    <link
      rel="icon"
      href="/src/assets/favicon.ico"
      sizes="any"
    />

    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#ffffff" />

    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/index.css" />
  </head>

  <body>
    <main class="app" hidden>
      <div class="segment">
        <button type="button" data-background data-selected>
          끔
        </button>

        <button type="button" data-background>
          디스플레이
        </button>

        <button type="button" data-background data-confirm>
          경고음
        </button>
      </div>

      <div class="stepper" data-background data-sign>
        <button
          type="button"
          data-icon="minus"
          data-step="-1"
        ></button>

        <div class="stepper-value">
          <button type="button" class="stepper-number">
            0
          </button>

          <input
            type="number"
            autocomplete="off"
            value="0"
            min="-20"
            max="20"
            step="1"
            hidden
          />

          <span>km/h</span>
        </div>

        <button
          type="button"
          data-icon="plus"
          data-step="1"
        ></button>
      </div>

      <div class="picker">
        <div
          class="picker-column"
          data-period
          data-values="오전,오후"
          data-value="오전"
        ></div>

        <div
          class="picker-column"
          data-hour
          data-loop
          data-min="1"
          data-max="12"
          data-value="1"
        ></div>

        <span class="picker-text"> : </span>

        <div
          class="picker-column"
          data-loop
          data-min="0"
          data-max="59"
          data-value="30"
        ></div>
      </div>
    </main>

    <script type="module" src="/src/js/script.js"></script>
  </body>
</html>
