<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title data-i18n="app.title">&#8203;</title>

    <link
      rel="icon"
      href="/src/assets/favicon.ico"
      sizes="any"
    />

    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#ffffff" />

    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/index.css" />
  </head>

  <body>
    <main class="app" hidden>
      <div class="switch" data-background>
        <label>
          <span>알림 받기</span>

          <input
            type="checkbox"
            name="notify"
            data-notify
          />
        </label>
      </div>

      <section class="communication-test">
        <div class="select" data-background>
          <select name="chatting-style">
            <option value="stream">스트림</option>
            <option value="messenger">메신저</option>
          </select>
        </div>

        <section class="chatting" data-chatting="stream">
          <div class="chatting-list"></div>

          <form class="chatting-form">
            <div class="input">
              <textarea
                class="chatting-input"
                name="message"
                rows="1"
                autocomplete="off"
                placeholder="메시지"
                data-control
                data-i18n-placeholder="메시지"
              ></textarea>

              <div class="input-actions">
                <button
                  type="button"
                  class="chatting-voice voice"
                  data-icon="voice"
                  data-circle
                  data-background
                  data-tooltip="음성 입력"
                ></button>

                <button
                  type="submit"
                  class="chatting-send"
                  data-icon="send"
                  data-circle
                  data-confirm
                  data-response
                  data-tooltip="전송"
                  hidden
                ></button>
              </div>
            </div>
          </form>
        </section>
      </section>
    </main>

    <div>
      <script
        type="module"
        src="/src/js/script.js"
      ></script>
    </div>
  </body>
</html>
